<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#5B5FC7;
    --purple-dark:#464775;
    --bg:#FAF9F8;
    --panel:#FFFFFF;
    --line:#E1DFDD;
    --text:#242424;
    --muted:#616161;
    --today-tint:#F0F0FB;
    --alx:#5B5FC7;
    --netacad:#0078D4;
    --unity:#CA5010;
    --duo:#107C10;
    --gx:clamp(10px, 4vw, 24px);
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;max-width:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter','Segoe UI',sans-serif;
    font-size:14px;
  }
  .app{max-width:1180px;margin:0 auto;padding:0 0 60px;width:100%;}

  /* Top bar */
  .topbar{
    display:flex;
    align-items:center;
    gap:clamp(6px,1.6vw,14px);
    padding:14px var(--gx);
    background:var(--panel);
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .brand{
    font-weight:700;
    font-size:17px;
    color:var(--purple-dark);
    margin-right:8px;
    white-space:nowrap;
  }
  .btn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--text);
    padding:7px clamp(8px,2vw,14px);
    border-radius:4px;
    font-size:clamp(12px,2.6vw,13.5px);
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{background:#F5F5F5;}
  .btn.primary{
    background:var(--purple);
    color:#fff;
    border-color:var(--purple);
  }
  .btn.primary:hover{background:var(--purple-dark);}
  .nav-arrows{display:flex;gap:2px;}
  .nav-arrows button{
    width:30px;height:30px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
    color:var(--text);
  }
  .nav-arrows button:hover{background:#F5F5F5;}
  .week-label{font-weight:600;font-size:clamp(13px,3vw,15px);margin-right:auto;white-space:nowrap;}
  .stat-pill{
    font-size:clamp(11px,2.4vw,12.5px);
    color:var(--muted);
    background:#F3F2F1;
    padding:5px 10px;
    border-radius:12px;
    font-weight:600;
    white-space:nowrap;
  }
  .stat-pill strong{color:var(--purple-dark);}

  /* Legend */
  .legend{
    display:flex;
    gap:16px;
    padding:10px var(--gx);
    background:var(--panel);
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
    font-size:12.5px;
    color:var(--muted);
  }
  .legend span{display:flex;align-items:center;gap:6px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}

  /* Today's checklist */
  .todo-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    margin:14px var(--gx) 0;
    padding:6px 4px;
  }
  .todo-panel h3{
    margin:0;
    padding:10px 14px 6px;
    font-size:13px;
    color:var(--purple-dark);
  }
  .todo-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 14px;
    border-top:1px solid var(--line);
  }
  .todo-row:first-of-type{border-top:none;}
  .todo-check{
    flex-shrink:0;
    width:18px;height:18px;
    border-radius:4px;
    border:2px solid var(--line);
    cursor:pointer;
    position:relative;
    background:#fff;
  }
  .todo-check.checked{border-color:transparent;}
  .todo-check.checked::after{
    content:'✓';
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:12px;font-weight:700;
  }
  .todo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .todo-text{flex:1;font-size:13.5px;min-width:0;}
  .todo-time{font-size:11.5px;color:var(--muted);flex-shrink:0;}
  .todo-row.done .todo-text{text-decoration:line-through;color:#9c9a96;}

  /* Toasts */
  #toastContainer{
    position:fixed;
    bottom:18px;right:18px;
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:999;
    max-width:min(320px, calc(100vw - 36px));
  }
  .toast{
    background:var(--purple-dark);
    color:#fff;
    padding:12px 14px;
    border-radius:6px;
    font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    display:flex;
    align-items:flex-start;
    gap:10px;
    animation:toastIn .25s ease;
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .toast .tclose{
    background:none;border:none;color:#fff;opacity:0.7;
    cursor:pointer;font-size:14px;line-height:1;margin-left:auto;
  }
  .toast .tclose:hover{opacity:1;}
  .toast .tdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
  .btn.bell-on{background:var(--purple);color:#fff;border-color:var(--purple);}

  /* Quick add panel */
  .add-panel{
    display:none;
    background:#fff;
    border:1px solid var(--purple);
    border-radius:6px;
    margin:14px var(--gx) 0;
    padding:14px 16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  .add-panel.open{display:block;}
  .add-panel .row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .add-panel input[type=text]{
    flex:1;min-width:180px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:14px;
  }
  .add-panel input[type=date], .add-panel input[type=time]{
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:13.5px;
  }
  .goal-pick{display:flex;gap:8px;align-items:center;}
  .goal-pick button{
    width:26px;height:26px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    opacity:0.55;
  }
  .goal-pick button.active{opacity:1;border-color:var(--text);}
  .add-panel .actions{display:flex;justify-content:flex-end;gap:8px;}

  /* Category manager */
  .cat-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-top:1px solid var(--line);
  }
  .cat-row:first-child{border-top:none;}
  .cat-row input[type=color]{
    width:34px;height:34px;
    padding:2px;
    border:1px solid var(--line);
    border-radius:4px;
    cursor:pointer;
    flex-shrink:0;
  }
  .cat-row input[type=text]{
    flex:1;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:13.5px;
  }
  .cat-row .del-btn{
    border:none;
    background:none;
    color:#A80000;
    cursor:pointer;
    font-size:13px;
    padding:6px 8px;
  }
  .cat-row .del-btn:hover{text-decoration:underline;}
  .cat-row .del-btn:disabled{color:var(--muted);cursor:not-allowed;text-decoration:none;}

  /* Calendar grid */
  .cal-wrap{
    background:var(--panel);
    margin:14px var(--gx) 0;
    border:1px solid var(--line);
    border-radius:6px;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    max-width:calc(100% - 2 * var(--gx));
  }
  .cal-header{
    display:grid;
    grid-template-columns:56px repeat(7,1fr);
    border-bottom:1px solid var(--line);
  }
  .cal-header .corner{border-right:1px solid var(--line);}
  .day-head{
    text-align:center;
    padding:10px 4px;
    border-right:1px solid var(--line);
  }
  .day-head:last-child{border-right:none;}
  .day-head .dname{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;}
  .day-head .dnum{
    font-size:16px;
    font-weight:600;
    margin-top:2px;
    display:inline-block;
    width:28px;height:28px;
    line-height:28px;
    border-radius:50%;
  }
  .day-head.today{background:var(--today-tint);}
  .day-head.today .dnum{background:var(--purple);color:#fff;}

  .cal-body{
    display:grid;
    grid-template-columns:56px repeat(7,1fr);
    position:relative;
    max-height:min(768px, 60vh);
    overflow-y:auto;
  }
  .time-col{border-right:1px solid var(--line);}
  .time-slot{
    height:48px;
    font-size:11px;
    color:var(--muted);
    text-align:right;
    padding-right:6px;
    transform:translateY(-6px);
    border-bottom:1px solid var(--line);
  }
  .day-col{
    border-right:1px solid var(--line);
    position:relative;
  }
  .day-col:last-child{border-right:none;}
  .day-col.today{background:var(--today-tint);}
  .cell{
    height:48px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .cell:hover{background:rgba(91,95,199,0.06);}
  .event{
    position:absolute;
    left:3px;right:3px;
    border-radius:4px;
    padding:3px 6px;
    font-size:11.5px;
    color:#fff;
    line-height:1.25;
    cursor:pointer;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,0.15);
  }
  .event.manual::after{
    content:'📌';
    position:absolute;
    top:1px;right:3px;
    font-size:9px;
    opacity:0.85;
  }
  .event[draggable="true"]{cursor:grab;}
  .event.dragging{opacity:0.35;}
  .cell.drop-hover{background:rgba(91,95,199,0.16);}

  /* Report + log */
  .lower{
    margin:22px var(--gx) 0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media(max-width:820px){
    .lower{grid-template-columns:1fr;}
    .cal-header,.cal-body{min-width:640px;}
  }
  @media(max-width:600px){
    .week-label{order:5;flex-basis:100%;text-align:center;margin:2px 0 0;}
    .brand{font-size:15px;}
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px;
  }
  .panel h3{margin:0 0 10px;font-size:14px;color:var(--purple-dark);}
  .panel textarea{
    width:100%;min-height:70px;
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 10px;
    font-family:inherit;
    font-size:13.5px;
    resize:vertical;
  }
  .panel .actions{display:flex;justify-content:flex-end;margin-top:8px;}
  .review-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .log-scroll{max-height:220px;overflow-y:auto;}
  .log-entry{border-top:1px solid var(--line);padding:10px 0;}
  .log-entry:first-child{border-top:none;}
  .log-date{font-size:11.5px;color:var(--purple-dark);font-weight:600;margin-bottom:3px;}
  .log-text{font-size:13px;color:#3c3c3c;line-height:1.45;}
  .empty{color:var(--muted);font-size:13px;font-style:italic;padding:6px 0;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">📅 Study Calendar</div>
    <button class="btn" id="todayBtn">Today</button>
    <div class="nav-arrows">
      <button id="prevBtn">‹</button>
      <button id="nextBtn">›</button>
    </div>
    <div class="week-label" id="weekLabel"></div>
    <span class="stat-pill">🔥 <strong id="streakNum">0</strong> day streak</span>
    <span class="stat-pill">ALX: <strong id="daysLeftALX">—</strong> days left</span>
    <button class="btn" id="shuffleBtn" title="Reshuffle recurring tasks that aren't done or pinned yet">🔀 Shuffle week</button>
    <button class="btn" id="manageCatBtn">🎨 Customize colors</button>
    <button class="btn" id="notifyBtn" title="Get an in-app (and browser, if allowed) alert when a task's time comes up">🔕 Reminders: Off</button>
    <button class="btn" id="autoGenBtn" title="Toggle whether the ledger auto-suggests recurring tasks each day">🤖 Auto-suggest: On</button>
    <button class="btn" id="clearDoneBtn" title="Remove today's completed tasks from the list">🗑 Clear completed</button>
    <button class="btn" id="exportBtn" title="Copy today's list as text">📋 Copy today</button>
    <button class="btn" id="resetAllBtn" title="Wipe all tasks, log entries, and streak to start fresh" style="color:#A80000;border-color:#e0a0a0;">♻️ Reset all data</button>
    <button class="btn primary" id="newTaskBtn">+ New task</button>
  </div>

  <div class="legend" id="legendBar"></div>

  <div class="todo-panel">
    <h3>✅ Today's List — tap to cross off</h3>
    <div id="todoList"></div>
  </div>

  <div class="add-panel" id="catPanel">
    <div class="row" style="font-weight:600;font-size:13px;color:var(--purple-dark);">What should each color mean?</div>
    <div id="catRows"></div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:10px;margin-top:2px;">
      <input type="color" id="newCatColor" value="#5B5FC7" style="width:38px;height:34px;padding:2px;border:1px solid var(--line);border-radius:4px;cursor:pointer;">
      <input type="text" id="newCatName" placeholder="New category name…">
      <button class="btn" id="addCatBtn">Add category</button>
    </div>
    <div class="actions">
      <button class="btn primary" id="closeCatBtn">Done</button>
    </div>
  </div>

  <div class="add-panel" id="addPanel">
    <div class="row">
      <input type="text" id="addText" placeholder="Task title…">
      <input type="date" id="addDate">
      <input type="time" id="addTime">
    </div>
    <div class="row" style="align-items:center;">
      <div class="goal-pick" id="goalPick"></div>
    </div>
    <div class="actions">
      <button class="btn" id="cancelAddBtn">Cancel</button>
      <button class="btn primary" id="confirmAddBtn">Add task</button>
    </div>
  </div>

  <div class="cal-wrap">
    <div class="cal-header" id="calHeader"></div>
    <div class="cal-body" id="calBody" style="height:768px;"></div>
  </div>

  <div class="lower">
    <div class="panel">
      <h3>Evening Report</h3>
      <textarea id="reportInput" placeholder="What did you study or build today?"></textarea>
      <div class="actions"><button class="btn primary" id="saveReportBtn">Save entry</button></div>
      <div class="review-note" id="reviewNote"></div>
    </div>
    <div class="panel">
      <h3>The Log</h3>
      <div class="log-scroll" id="logList"></div>
    </div>
  </div>

</div>

<div id="toastContainer"></div>

<script>
const DEFAULT_GOALS = {
  alx:     { name:'ALX Course', hex:'#5B5FC7' },
  netacad: { name:'Networking (Netacad)', hex:'#0078D4' },
  unity:   { name:'Unity / Game Dev', hex:'#CA5010' },
  duo:     { name:'Duolingo Prep', hex:'#107C10' },
};
const POOLS = {
  alx:['Complete next module/checkpoint','Submit pending peer review','Review mentor feedback','Work on project task'],
  netacad:['Watch next lesson video','Do the module quiz','Practice a subnetting problem','Review last session\'s notes'],
  unity:['Follow next tutorial section','Prototype one small mechanic','Sketch a game idea','Fix a bug in current project'],
  duo:['Practice a speaking/writing prompt','Review a grammar weak point','Do a timed practice section','Read an article aloud']
};
const START_HOUR=6, END_HOUR=22, ROW_H=48;

let state = {
  goals: {},              // customizable: gid -> {name, hex}
  events: [],           // {id,date,time,goal,text,done}
  generatedDates: [],
  log: [],               // {date,text}
  streak: 0,
  lastCompletedDate: null,
  alxDeadline: null,
  settings: { notify:false, autoGenerate:true }
};
let weekOffset = 0;
let pending = null; // {date,time} for add panel

const pad=n=>String(n).padStart(2,'0');
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>dateKey(new Date());

function startOfWeek(offset){
  const d = new Date();
  d.setHours(0,0,0,0);
  const day = (d.getDay()+6)%7; // Monday=0
  d.setDate(d.getDate()-day+offset*7);
  return d;
}
function seededIndex(seedStr, mod){
  let h=0;
  for(let i=0;i<seedStr.length;i++) h=(h*31+seedStr.charCodeAt(i))>>>0;
  return mod>0 ? h%mod : 0;
}
function daysBetween(dateStr){
  if(!dateStr) return null;
  return Math.round((new Date(dateStr+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);
}

function generateAutoTasksFor(dStr){
  if(!state.settings.autoGenerate) return;
  if(state.generatedDates.includes(dStr)) return;
  const goalIds = Object.keys(POOLS).filter(gid=>state.goals[gid]);
  const dayIdx = Math.floor(new Date(dStr+'T00:00:00').getTime()/86400000);
  const featured = dayIdx % goalIds.length;
  const times = ['08:30','10:30','13:00','15:30','18:30'];
  let ti=0;
  goalIds.forEach((gid,idx)=>{
    const count = idx===featured ? 2 : 1;
    for(let c=0;c<count;c++){
      const text = POOLS[gid][seededIndex(dStr+gid+c, POOLS[gid].length)];
      state.events.push({
        id: dStr+'-'+gid+'-'+c+'-'+Math.random().toString(36).slice(2,7),
        date: dStr, time: times[ti]||'19:00', goal: gid, text, done:false, auto:true
      });
      ti++;
    }
  });
  state.generatedDates.push(dStr);
}

function ensureWeekGenerated(){
  const start = startOfWeek(weekOffset);
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    generateAutoTasksFor(dateKey(d));
  }
}

function updateStreak(){
  const t = todayStr();
  const todays = state.events.filter(e=>e.date===t);
  const allDone = todays.length>0 && todays.every(e=>e.done);
  if(allDone && state.lastCompletedDate!==t){
    state.streak+=1; state.lastCompletedDate=t;
  } else if(!allDone && state.lastCompletedDate===t){
    state.streak=Math.max(0,state.streak-1); state.lastCompletedDate=null;
  }
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ---- Toasts + reminders ---- */
function showToast(text, hex, ms){
  const box = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="tdot" style="background:${hex||'#B08D57'}"></span><span>${escapeHtml(text)}</span><button class="tclose">✕</button>`;
  t.querySelector('.tclose').addEventListener('click', ()=>t.remove());
  box.appendChild(t);
  setTimeout(()=>{ if(t.parentNode) t.remove(); }, ms||7000);
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type='sine'; osc.frequency.value=880;
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.35);
  }catch(e){ /* audio not available, ignore */ }
}

const notifiedThisSession = new Set();

function checkReminders(){
  if(!state.settings.notify) return;
  const now = new Date();
  const t = todayStr();
  const hhmm = pad(now.getHours())+':'+pad(now.getMinutes());
  state.events
    .filter(e=>e.date===t && !e.done && e.time===hhmm)
    .forEach(e=>{
      const key = e.id+'@'+hhmm;
      if(notifiedThisSession.has(key)) return;
      notifiedThisSession.add(key);
      const g = state.goals[e.goal] || {name:'Task', hex:'#B08D57'};
      showToast(`${g.name}: ${e.text}`, g.hex, 10000);
      playBeep();
      if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
        try{ new Notification('Time for: '+g.name, { body:e.text }); }catch(err){}
      }
    });
}

async function toggleNotifications(){
  state.settings.notify = !state.settings.notify;
  if(state.settings.notify){
    if(typeof Notification !== 'undefined' && Notification.permission === 'default'){
      try{ await Notification.requestPermission(); }catch(e){}
    }
    showToast('Reminders on — I\'ll alert you here when a scheduled task\'s time arrives (browser notifications too, if allowed).', '#107C10');
  } else {
    showToast('Reminders off.', '#8A8886');
  }
  save(); render();
}

function clearCompletedToday(){
  const t = todayStr();
  const before = state.events.length;
  state.events = state.events.filter(e=>!(e.date===t && e.done));
  const removed = before - state.events.length;
  save(); render();
  showToast(removed ? `Cleared ${removed} completed task${removed===1?'':'s'} from today.` : 'Nothing completed to clear yet.', '#5B5FC7');
}

async function exportToday(){
  const t = todayStr();
  const todays = state.events.filter(e=>e.date===t).sort((a,b)=>a.time.localeCompare(b.time));
  const lines = [`Today's list — ${new Date(t+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}`, ''];
  todays.forEach(e=>{
    const g = state.goals[e.goal] || {name:'Task'};
    lines.push(`${e.done?'[x]':'[ ]'} ${e.time} — ${g.name}: ${e.text}`);
  });
  if(!todays.length) lines.push('(nothing scheduled)');
  const text = lines.join('\n');
  try{
    await navigator.clipboard.writeText(text);
    showToast('Copied today\'s list to your clipboard.', '#107C10');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); showToast('Copied today\'s list to your clipboard.', '#107C10'); }
    catch(err){ showToast('Could not copy automatically — select and copy manually.', '#9C4A3C'); }
    ta.remove();
  }
}

function renderLegend(){
  const el=document.getElementById('legendBar');
  el.innerHTML='';
  Object.values(state.goals).forEach(g=>{
    const span=document.createElement('span');
    span.innerHTML=`<span class="dot" style="background:${g.hex}"></span>${escapeHtml(g.name)}`;
    el.appendChild(span);
  });
}

function renderTodoList(){
  const el = document.getElementById('todoList');
  el.innerHTML = '';
  const t = todayStr();
  const todays = state.events.filter(e=>e.date===t).sort((a,b)=>a.time.localeCompare(b.time));
  if(!todays.length){
    el.innerHTML = '<div class="todo-row" style="border-top:none;"><span class="todo-text" style="color:var(--muted);font-style:italic;">Nothing on today\'s list yet — add a task on the calendar below.</span></div>';
    return;
  }
  todays.forEach(ev=>{
    const g = state.goals[ev.goal] || {hex:'#8A8886'};
    const row = document.createElement('div');
    row.className = 'todo-row' + (ev.done?' done':'');
    row.innerHTML = `
      <div class="todo-check ${ev.done?'checked':''}" style="${ev.done?'background:'+g.hex+';':''}"></div>
      <span class="todo-dot" style="background:${g.hex}"></span>
      <span class="todo-time">${ev.time}</span>
      <span class="todo-text">${escapeHtml(ev.text)}</span>
    `;
    row.querySelector('.todo-check').addEventListener('click', ()=>{
      ev.done = !ev.done;
      updateStreak();
      save(); render();
    });
    el.appendChild(row);
  });
}

function render(){
  ensureWeekGenerated();
  renderLegend();
  renderTodoList();
  buildGoalPicker();
  const start = startOfWeek(weekOffset);
  const end = new Date(start); end.setDate(start.getDate()+6);
  const opts={month:'short',day:'numeric'};
  document.getElementById('weekLabel').textContent =
    `${start.toLocaleDateString('en-US',opts)} – ${end.toLocaleDateString('en-US',{...opts,year:'numeric'})}`;
  document.getElementById('streakNum').textContent = state.streak;
  const dl = daysBetween(state.alxDeadline);
  document.getElementById('daysLeftALX').textContent = state.alxDeadline ? (dl>=0?dl:'past due') : '—';
  const notifyBtn = document.getElementById('notifyBtn');
  notifyBtn.textContent = state.settings.notify ? '🔔 Reminders: On' : '🔕 Reminders: Off';
  notifyBtn.classList.toggle('bell-on', state.settings.notify);
  const autoGenBtn = document.getElementById('autoGenBtn');
  autoGenBtn.textContent = state.settings.autoGenerate ? '🤖 Auto-suggest: On' : '🤖 Auto-suggest: Off';
  autoGenBtn.classList.toggle('bell-on', state.settings.autoGenerate);

  // header
  const headerEl = document.getElementById('calHeader');
  headerEl.innerHTML = '<div class="corner"></div>';
  const dayNames=['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const days=[];
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = dateKey(d);
    days.push(key);
    const isToday = key===todayStr();
    const div = document.createElement('div');
    div.className='day-head'+(isToday?' today':'');
    div.innerHTML = `<div class="dname">${dayNames[i]}</div><div class="dnum">${d.getDate()}</div>`;
    headerEl.appendChild(div);
  }

  // body
  const bodyEl = document.getElementById('calBody');
  bodyEl.innerHTML='';
  const nSlots = END_HOUR-START_HOUR;
  bodyEl.style.height = (nSlots*ROW_H)+'px';

  const timeCol = document.createElement('div');
  timeCol.className='time-col';
  for(let h=START_HOUR;h<END_HOUR;h++){
    const slot=document.createElement('div');
    slot.className='time-slot';
    const hr12 = h%12===0?12:h%12;
    const ampm = h<12?'AM':'PM';
    slot.textContent=`${hr12} ${ampm}`;
    timeCol.appendChild(slot);
  }
  bodyEl.appendChild(timeCol);

  days.forEach(dKey=>{
    const col = document.createElement('div');
    col.className='day-col'+(dKey===todayStr()?' today':'');
    for(let h=START_HOUR;h<END_HOUR;h++){
      const cell=document.createElement('div');
      cell.className='cell';
      cell.dataset.date=dKey;
      cell.dataset.time=`${pad(h)}:00`;
      cell.addEventListener('click',()=>openAddPanel(dKey, `${pad(h)}:00`));
      cell.addEventListener('dragover',(e)=>{ e.preventDefault(); cell.classList.add('drop-hover'); });
      cell.addEventListener('dragleave',()=>{ cell.classList.remove('drop-hover'); });
      cell.addEventListener('drop',(e)=>{
        e.preventDefault();
        cell.classList.remove('drop-hover');
        const id = e.dataTransfer.getData('text/plain');
        const ev = state.events.find(x=>x.id===id);
        if(ev){
          ev.date = cell.dataset.date;
          ev.time = cell.dataset.time;
          ev.manual = true;
          save(); render();
        }
      });
      col.appendChild(cell);
    }
    // events
    state.events.filter(e=>e.date===dKey).forEach(ev=>{
      const [h,m]=ev.time.split(':').map(Number);
      const top = ((h-START_HOUR)+(m/60))*ROW_H;
      const box=document.createElement('div');
      box.className='event'+(ev.done?' done':'')+(ev.manual?' manual':'');
      box.style.top=top+'px';
      box.style.height=(ROW_H-4)+'px';
      box.style.background=(state.goals[ev.goal]||{hex:'#8A8886'}).hex;
      box.innerHTML=`<span class="etime">${ev.time}</span>${escapeHtml(ev.text)}`;
      box.title=ev.manual ? 'Pinned by you — click to toggle complete, drag to move again' : 'Click to toggle complete, drag to move';
      box.draggable = true;
      box.addEventListener('dragstart',(e)=>{
        e.dataTransfer.setData('text/plain', ev.id);
        box.classList.add('dragging');
      });
      box.addEventListener('dragend',()=>{ box.classList.remove('dragging'); });
      box.addEventListener('click',(e)=>{
        e.stopPropagation();
        ev.done=!ev.done;
        updateStreak();
        save(); render();
      });
      col.appendChild(box);
    });
    bodyEl.appendChild(col);
  });

  // log
  const logEl=document.getElementById('logList');
  logEl.innerHTML='';
  if(!state.log.length){
    logEl.innerHTML='<div class="empty">No entries yet — your evening report will appear here.</div>';
  } else {
    [...state.log].reverse().forEach(entry=>{
      const el=document.createElement('div');
      el.className='log-entry';
      const dd=new Date(entry.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
      el.innerHTML=`<div class="log-date">${dd}</div><div class="log-text">${escapeHtml(entry.text)}</div>`;
      logEl.appendChild(el);
    });
  }
  const reviewEl=document.getElementById('reviewNote');
  const t=todayStr();
  const todayMs=new Date(t+'T00:00:00').getTime();
  const hits=[];
  [1,3,7].forEach(days=>{
    const target=new Date(todayMs-days*86400000).toISOString().slice(0,10);
    const e=state.log.find(x=>x.date===target);
    if(e) hits.push({days,e});
  });
  reviewEl.innerHTML = hits.length
    ? 'Worth a glance: '+hits.map(h=>`<strong>${h.days}d ago:</strong> ${escapeHtml(h.e.text.slice(0,60))}${h.e.text.length>60?'…':''}`).join(' &nbsp;|&nbsp; ')
    : '';
}

function openAddPanel(dateStr, timeStr){
  document.getElementById('catPanel').classList.remove('open');
  pending = {date:dateStr, time:timeStr};
  document.getElementById('addDate').value=dateStr;
  document.getElementById('addTime').value=timeStr;
  document.getElementById('addText').value='';
  document.getElementById('addPanel').classList.add('open');
  document.getElementById('addText').focus();
}

function buildGoalPicker(){
  const el=document.getElementById('goalPick');
  const prevSelected = el.dataset.selected;
  el.innerHTML='';
  const ids = Object.keys(state.goals);
  const keepSelected = ids.includes(prevSelected) ? prevSelected : ids[0];
  ids.forEach((gid,i)=>{
    const g = state.goals[gid];
    const b=document.createElement('button');
    b.type='button';
    b.style.background=g.hex;
    b.title=g.name;
    b.dataset.gid=gid;
    if(gid===keepSelected) b.classList.add('active');
    b.addEventListener('click',()=>{
      el.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      el.dataset.selected=gid;
    });
    el.appendChild(b);
  });
  el.dataset.selected = keepSelected || '';
}

function renderCatPanel(){
  const rows=document.getElementById('catRows');
  rows.innerHTML='';
  const ids=Object.keys(state.goals);
  ids.forEach(gid=>{
    const g=state.goals[gid];
    const row=document.createElement('div');
    row.className='cat-row';
    row.innerHTML=`
      <input type="color" value="${g.hex}" data-gid="${gid}" class="cat-color">
      <input type="text" value="${escapeHtml(g.name)}" data-gid="${gid}" class="cat-name">
      <button class="del-btn" data-gid="${gid}" ${ids.length<=1?'disabled':''}>Delete</button>
    `;
    rows.appendChild(row);
  });
  rows.querySelectorAll('.cat-color').forEach(inp=>{
    inp.addEventListener('input',()=>{
      state.goals[inp.dataset.gid].hex = inp.value;
      save(); render();
    });
  });
  rows.querySelectorAll('.cat-name').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const v = inp.value.trim();
      if(v) state.goals[inp.dataset.gid].name = v;
      save(); render();
    });
  });
  rows.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const gid = btn.dataset.gid;
      const remaining = Object.keys(state.goals).filter(id=>id!==gid);
      if(!remaining.length) return;
      const fallback = remaining[0];
      state.events.forEach(ev=>{ if(ev.goal===gid) ev.goal=fallback; });
      delete state.goals[gid];
      save(); render();
    });
  });
}

function shuffleDate(dStr){
  const evs = state.events.filter(e=>e.date===dStr && e.auto && !e.done && !e.manual);
  if(evs.length<2) return;
  const times = evs.map(e=>e.time);
  for(let i=times.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [times[i],times[j]]=[times[j],times[i]];
  }
  evs.forEach((e,i)=>{
    e.time = times[i];
    const pool = POOLS[e.goal];
    if(pool && pool.length){
      let pick;
      do{ pick = pool[Math.floor(Math.random()*pool.length)]; } while(pool.length>1 && pick===e.text);
      e.text = pick;
    }
  });
}
function shuffleVisibleWeek(){
  const start = startOfWeek(weekOffset);
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    shuffleDate(dateKey(d));
  }
  save(); render();
}

async function load(){
  try{
    const res = await window.storage.get('teams-cal-state');
    if(res && res.value) state = JSON.parse(res.value);
  }catch(e){}
  if(!state.goals || !Object.keys(state.goals).length){
    state.goals = JSON.parse(JSON.stringify(DEFAULT_GOALS));
  }
  if(!state.settings){
    state.settings = { notify:false, autoGenerate:true };
  } else {
    if(typeof state.settings.notify !== 'boolean') state.settings.notify = false;
    if(typeof state.settings.autoGenerate !== 'boolean') state.settings.autoGenerate = true;
  }
  render();
}
async function save(){
  try{ await window.storage.set('teams-cal-state', JSON.stringify(state)); }
  catch(e){ console.error(e); }
}

document.getElementById('prevBtn').addEventListener('click',()=>{weekOffset--; render();});
document.getElementById('nextBtn').addEventListener('click',()=>{weekOffset++; render();});
document.getElementById('todayBtn').addEventListener('click',()=>{weekOffset=0; render();});
document.getElementById('newTaskBtn').addEventListener('click',()=>{
  const now=new Date();
  openAddPanel(todayStr(), `${pad(now.getHours()+1)}:00`);
});
document.getElementById('cancelAddBtn').addEventListener('click',()=>{
  document.getElementById('addPanel').classList.remove('open');
});
document.getElementById('confirmAddBtn').addEventListener('click',()=>{
  const text=document.getElementById('addText').value.trim();
  const date=document.getElementById('addDate').value;
  const time=document.getElementById('addTime').value || '09:00';
  const gid=document.getElementById('goalPick').dataset.selected || 'alx';
  if(!text || !date) return;
  state.events.push({
    id:date+'-'+gid+'-'+Math.random().toString(36).slice(2,8),
    date, time, goal:gid, text, done:false, auto:false
  });
  document.getElementById('addPanel').classList.remove('open');
  save(); render();
});
document.getElementById('shuffleBtn').addEventListener('click', shuffleVisibleWeek);
document.getElementById('notifyBtn').addEventListener('click', toggleNotifications);
document.getElementById('autoGenBtn').addEventListener('click', ()=>{
  state.settings.autoGenerate = !state.settings.autoGenerate;
  save(); render();
  showToast(state.settings.autoGenerate ? 'Auto-suggested tasks are back on.' : 'Auto-suggest is off — add tasks yourself whenever you like.', '#5B5FC7');
});
document.getElementById('clearDoneBtn').addEventListener('click', clearCompletedToday);
document.getElementById('exportBtn').addEventListener('click', exportToday);
document.getElementById('resetAllBtn').addEventListener('click', ()=>{
  const ok = confirm('This clears all tasks, the log, and your streak so you can start fresh. Your color categories stay as-is. This can\'t be undone — continue?');
  if(!ok) return;
  state.events = [];
  state.generatedDates = [];
  state.log = [];
  state.streak = 0;
  state.lastCompletedDate = null;
  state.alxDeadline = null;
  notifiedThisSession.clear();
  save(); render();
  showToast('Ledger cleared. Add your own tasks whenever you\'re ready.', '#9C4A3C');
});
document.getElementById('manageCatBtn').addEventListener('click',()=>{
  document.getElementById('addPanel').classList.remove('open');
  renderCatPanel();
  document.getElementById('catPanel').classList.add('open');
});
document.getElementById('closeCatBtn').addEventListener('click',()=>{
  document.getElementById('catPanel').classList.remove('open');
});
document.getElementById('addCatBtn').addEventListener('click',()=>{
  const name = document.getElementById('newCatName').value.trim();
  const hex = document.getElementById('newCatColor').value;
  if(!name) return;
  let base = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'category';
  let gid = base, n=1;
  while(state.goals[gid]) gid = base+'-'+(++n);
  state.goals[gid] = { name, hex };
  document.getElementById('newCatName').value='';
  document.getElementById('newCatColor').value='#5B5FC7';
  save(); render(); renderCatPanel();
});
document.getElementById('saveReportBtn').addEventListener('click',()=>{
  const val=document.getElementById('reportInput').value.trim();
  if(!val) return;
  const t=todayStr();
  const existing=state.log.find(e=>e.date===t);
  if(existing) existing.text+='\n'+val; else state.log.push({date:t,text:val});
  document.getElementById('reportInput').value='';
  save(); render();
});

load();
setInterval(checkReminders, 30000);
</script>
</body>
